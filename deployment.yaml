apiVersion: apps/v1
kind: Deployment
metadata:
  name: diploma-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diploma-app
  template:
    metadata:
      labels:
        app: diploma-app
    spec:
      imagePullSecrets:
        - name: gitverse-cred
      containers:
        - name: diploma-app
          image: gitverse.ru/lar/diploma-app:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: diploma-app
spec:
  type: NodePort
  selector:
    app: diploma-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
